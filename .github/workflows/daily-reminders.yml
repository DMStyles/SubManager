name: Daily Installment Reminders

on:
  schedule:
    # Runs at 04:00 UTC every day (9:30 AM Sri Lanka / India time)
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force send reminders today (ignore day schedule)'
        required: false
        default: 'true'

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: ./scripts
        run: npm install

      - name: Run reminders script
        working-directory: ./scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FORCE_SEND: ${{ github.event.inputs.force || 'false' }}
        run: npm start
